services:
  svi:
    container_name: svi-cli
    build: .
    working_dir: /app
    environment:
      - PNPM_STORE_PATH=/pnpm-store
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - dist:/app/dist
      - pnpm-store:/pnpm-store
    stdin_open: true
    tty: true

volumes:
  pnpm-store:
  node_modules:
  dist: